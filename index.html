<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Österreich Tafel Marchfeld</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="card hero">
        <p class="eyebrow">Team Österreich Tafel Marchfeld</p>
        <h1>Am kommenden Samstag dabei?</h1>
        <p class="subtitle">
          Bitte trage nur deine Familiennummer ein und gib an, ob ihr bei der
          kommenden Tafel-Ausgabe am Samstag Lebensmittel abholt.
        </p>
      </header>

      <nav class="app-nav">
        <a href="index.html" class="active">Anmeldung</a>
        <a href="admin-clients.html">Klientenverwaltung</a>
        <a href="liste-drucken.html">Ausgabeliste</a>
      </nav>

      <section class="card form-card">
        <form id="attendance-form">
          <div class="field-group">
            <label for="family-number">Familiennummer</label>
            <input
              id="family-number"
              name="family-number"
              type="number"
              min="1"
              inputmode="numeric"
              placeholder="z. B. 12"
              required
            />
          </div>

          <fieldset class="field-group">
            <legend>Kommt ihr am kommenden Samstag?</legend>
            <label class="option">
              <input type="radio" name="attendance" value="ja" required />
              <span>Ja, wir kommen</span>
            </label>
            <label class="option">
              <input type="radio" name="attendance" value="nein" />
              <span>Nein, wir kommen nicht</span>
            </label>
          </fieldset>

          <button type="submit">Antwort speichern</button>
        </form>

        <p id="form-message" class="message" aria-live="polite"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="shared.js"></script>
    <script src="script.js"></script>
  </body>
</html>
