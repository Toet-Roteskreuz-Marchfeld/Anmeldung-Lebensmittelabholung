<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ausgabeliste - Team Österreich Tafel Marchfeld</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container admin-container">
      <header class="card hero admin-hero no-print">
        <div class="hero-row">
          <p class="eyebrow">Team Österreich Tafel Marchfeld</p>
          <button id="header-auth-button" type="submit" form="admin-login-form">Login</button>
        </div>
        <h1>Ausgabeliste</h1>
      </header>

      <nav class="app-nav no-print">
        <a href="index.html">Anmeldung</a>
        <a href="admin-clients.html">Klientenverwaltung</a>
        <a href="liste-drucken.html" class="active">Ausgabeliste</a>
      </nav>

      <section id="error-section" class="card form-card hidden">
        <p id="error-message" class="message error" aria-live="polite"></p>
      </section>

      <section id="print-section" class="card results-card hidden">
        <div class="results-header no-print">
          <h2 id="period-label">Ausgabeliste</h2>
          <div class="results-actions">
            <button id="print-button" type="button">Drucken</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nr.</th>
                <th>EW</th>
                <th>Ki</th>
                <th>EP</th>
                <th>Musl.</th>
                <th>Hund</th>
                <th>Katze</th>
                <th>Sonst.</th>
              </tr>
            </thead>
            <tbody id="print-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="shared.js"></script>
    <script src="liste-drucken.js"></script>
  </body>
</html>
